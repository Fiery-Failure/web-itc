<!DOCTYPE html>
<!--  TO CHANGE THE MENU LATER: edit the list in script.js, not this file. -->
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kamp Kape MNL | Menu</title>
  <meta name="description" content="Browse the Kamp Kape MNL menu: coffee, non-coffee drinks, and pastries.">

  <!-- STYLES: uncomment once style.css exists -->
  <!-- <link rel="stylesheet" href="style.css"> -->

  <!-- SCRIPTS: uncomment once script.js exists. Required for the menu to display -->
  <!-- <script src="script.js" defer></script> -->
</head>

<body>

  <header id="site-header">
    <a href="index.html" id="logo">
      <img src="https://scontent.fmnl17-5.fna.fbcdn.net/v/t39.30808-6/640114021_122094841971288350_2284737999150468777_n.jpg?stp=dst-jpg_tt6&amp;cstp=mx2000x2000&amp;ctp=s2000x2000&amp;_nc_cat=107&amp;_nc_map=urlgen_bucketless&amp;ccb=1-7&amp;_nc_sid=6ee11a&amp;_nc_eui2=AeGNLHO1jwr1we4lg1iIo52_di0075TkURB2LTTvlORREOe4Qle4yDIjGZel0OZofsEOoiTboHbAn5RkEdRspNF6&amp;_nc_ohc=LRAyBTvbKVcQ7kNvwENy0ET&amp;_nc_oc=Adp23PDcijnLNaODMb79QVyTWgglpaekXdaxc2fYryzzlRsPLAAPwTf8OgvJs5EnxyQ&amp;_nc_zt=23&amp;_nc_ht=scontent.fmnl17-5.fna&amp;_nc_gid=dOTGK9VfHka47zWiitBhiw&amp;_nc_ss=7b2a8&amp;oh=00_AQT4YB3ZANghqmPPOdtCKN1YpKKQVHfMQNSeaRfS6-JGzw&amp;oe=6B0845F8"
           alt="Kamp Kape MNL logo" width="50" height="50">
      <span>Kamp Kape MNL</span>
    </a>

    <nav id="main-nav" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
      </ul>
    </nav>
  </header>


  <main>

    <h1>Our Menu</h1>

    <!-- search box -->
    <section id="menu-search">
      <!-- A label connected to the input by matching "for" and "id" (helps screen readers) -->
      <label for="search-input">Search the menu</label>
      <input type="search" id="search-input" placeholder="e.g. latte">
    </section>


    <!-- Category tabs -->
    <nav id="category-tabs" aria-label="Menu categories"></nav>


    <!-- Menu list -->
    <section id="menu-list" aria-live="polite"></section>


    <!-- msg that results from no results -->
    <p id="no-results" hidden>No items match your search. Try another word or category.</p>


    <!-- Menu template -->
    <template id="menu-item-template">
      <article class="menu-item">
        <img class="item-image" src="images/placeholder.png" alt="">
        <h2 class="item-name"></h2>
        <p class="item-description"></p>
        <p class="item-price"></p>
      </article>
    </template>

  </main>


  <footer id="site-footer">
    <p>&copy; 2026 Kamp Kape MNL. All rights reserved.</p>
  </footer>

</body>

</html>
